<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newswire24 - Fast, Verified & Trusted News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <a href="index.html" class="text-2xl font-black text-red-600 dark:text-red-500 tracking-tight">Newswire24</a>
                <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium hidden sm:block">Fast, Verified & Trusted Daily News</p>
            </div>
            <div id="headerActions" class="flex items-center space-x-2">
                <button id="themeToggle" class="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg text-xs font-bold text-gray-700 dark:text-gray-200">🌙 Dark Mode</button>
                <button id="langToggle" class="px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold hover:opacity-90 transition">🇮🇳 हिंदी</button>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="bg-red-600 text-white overflow-x-auto">
            <div class="max-w-6xl mx-auto px-4 flex space-x-6 text-xs font-bold py-2.5 whitespace-nowrap">
                <button onclick="filterCategory('All')" class="hover:underline">Home</button>
                <button onclick="filterCategory('National')" class="hover:underline">National</button>
                <button onclick="filterCategory('International')" class="hover:underline">International</button>
                <button onclick="filterCategory('Sports')" class="hover:underline">Sports</button>
                <button onclick="filterCategory('Entertainment')" class="hover:underline">Entertainment</button>
                <button onclick="filterCategory('Education')" class="hover:underline">Education</button>
                <button onclick="filterCategory('Business')" class="hover:underline">Business</button>
            </div>
        </nav>
    </header>

    <!-- Main Content Layout -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Left: News Feed -->
        <section class="md:col-span-2 space-y-4">
            <div class="flex justify-between items-center border-b border-gray-300 dark:border-gray-700 pb-2">
                <h1 id="currentCategoryTitle" class="text-lg font-black uppercase text-gray-800 dark:text-white">Latest Breaking News</h1>
                <span id="articleCountBadge" class="text-[11px] font-bold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-2 py-0.5 rounded">Total: 0</span>
            </div>

            <!-- News Articles Container -->
            <div id="newsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Injected via JS -->
            </div>

            <!-- Pagination -->
            <div id="paginationControls" class="flex justify-center items-center space-x-2 pt-6">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Right: Sidebar -->
        <aside class="space-y-6">
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 text-center">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Advertisement</p>
                <div class="w-full h-60 bg-gray-100 dark:bg-gray-700 border-2 border-dashed border-gray-300 dark:border-gray-600 flex items-center justify-center text-xs text-gray-400 font-bold rounded-lg">
                    Google AdSense Placeholder (Sidebar)
                </div>
            </div>
        </aside>
    </main>

    <!-- Modal -->
    <div id="articleModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl border border-gray-200 dark:border-gray-700">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm hover:bg-gray-300">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-gray-300 mt-12 py-8 border-t border-slate-800">
        <div class="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
            <div>
                <h3 class="text-sm font-bold text-white mb-2">Newswire24</h3>
                <p class="text-gray-400 leading-relaxed">Verified, real-time daily news publication.</p>
            </div>
            <div>
                <h3 class="text-sm font-bold text-white mb-2">Legal Compliance</h3>
                <ul class="space-y-1 text-gray-400">
                    <li><button onclick="showLegalPage('about')" class="hover:underline text-left">About Us</button></li>
                    <li><button onclick="showLegalPage('privacy')" class="hover:underline text-left">Privacy Policy</button></li>
                    <li><button onclick="showLegalPage('terms')" class="hover:underline text-left">Terms & Conditions</button></li>
                    <li><button onclick="showLegalPage('disclaimer')" class="hover:underline text-left">Disclaimer</button></li>
                </ul>
            </div>
        </div>
        <div class="max-w-6xl mx-auto px-4 mt-6 pt-4 border-t border-slate-800 text-[11px] text-gray-500 flex flex-col sm:flex-row justify-between">
            <p>© 2026 Newswire24. All rights reserved.</p>
            <p>Author Byline: Gaurav Sharma</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
