<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newswire24</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --primary-dark: #b71c1c;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #212121;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--primary-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        nav {
            background-color: var(--primary-color);
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 10px;
        }

        .category-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            white-space: nowrap;
        }

        .category-btn:hover, .category-btn.active {
            background-color: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h2.section-title {
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
            margin-bottom: 20px;
            color: #111;
        }

        #news-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .news-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .news-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .news-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-content h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            line-height: 1.4;
        }

        .news-content p {
            font-size: 14px;
            color: #555;
            flex-grow: 1;
        }

        .news-content a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: var(--primary-color);
            font-weight: bold;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Newswire24</div>
        <div class="header-actions">
            <button id="lang-toggle-btn" class="btn">🌐 Switch to Hindi</button>
        </div>
    </header>

    <nav>
        <button class="category-btn active" data-category="general">Home</button>
        <button class="category-btn" data-category="nation">National</button>
        <button class="category-btn" data-category="world">International</button>
        <button class="category-btn" data-category="sports">Sports</button>
        <button class="category-btn" data-category="entertainment">Entertainment</button>
        <button class="category-btn" data-category="technology">Technology</button>
        <button class="category-btn" data-category="business">Business</button>
    </nav>

    <div class="container">
        <h2 class="section-title">TOP HEADLINES</h2>
        <div id="news-container">
            <p class="loading">Fetching news...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
